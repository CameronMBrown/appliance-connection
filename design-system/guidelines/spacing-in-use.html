<!doctype html><html><head>
<meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--color-bg)}.section{padding-block:var(--space-2xl);border-bottom:1px solid var(--color-border)}.container{max-width:640px;margin-inline:auto;padding-inline:var(--space-lg)}.eyebrow{margin-bottom:var(--space-sm)}h2{font-size:var(--text-xl);margin:0 0 var(--space-sm)}p{margin:0;color:var(--color-text-soft);font-size:14px}</style>
</head><body>
<div class="section"><div class="container"><p class="eyebrow">Section eyebrow</p><h2>Heading uses space-sm below eyebrow</h2><p>Body copy sits space-sm under the heading; the whole section pads space-2xl top/bottom.</p></div></div>
</body></html>
