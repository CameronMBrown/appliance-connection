<!-- @dsCard group="Spacing" viewport="700x260" name="Spacing Scale" subtitle="16px root — generous editorial rhythm" -->
<!doctype html><html><head>
<meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-mono);font-size:11px}.row{display:grid;grid-template-columns:5rem 1fr;gap:10px;align-items:center;padding-block:4px}.bar{height:12px;background:var(--color-accent);border-radius:2px}</style>
</head><body>
<div class="row"><span>xs · 8px</span><div class="bar" style="width:var(--space-xs)"></div></div>
<div class="row"><span>sm · 12px</span><div class="bar" style="width:var(--space-sm)"></div></div>
<div class="row"><span>md · 16px</span><div class="bar" style="width:var(--space-md)"></div></div>
<div class="row"><span>lg · 24px</span><div class="bar" style="width:var(--space-lg)"></div></div>
<div class="row"><span>xl · 32px</span><div class="bar" style="width:var(--space-xl)"></div></div>
<div class="row"><span>2xl · 48px</span><div class="bar" style="width:var(--space-2xl)"></div></div>
<div class="row"><span>3xl · 64px</span><div class="bar" style="width:var(--space-3xl)"></div></div>
<div class="row"><span>4xl · 96px</span><div class="bar" style="width:var(--space-4xl)"></div></div>
</body></html>
