<!doctype html><html><head>
<meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-body);background:#fff;background-image:none}.row{display:flex;gap:18px;font-size:11px;color:var(--color-text-muted);text-align:center}.box{width:78px;height:56px;border:1px solid var(--color-border-strong);background:var(--color-surface);box-shadow:var(--shadow-sm);margin-bottom:6px}</style>
</head><body>
<div class="row">
<div><div class="box" style="border-radius:var(--radius-none)"></div>none · 0</div>
<div><div class="box" style="border-radius:var(--radius-input)"></div>input · 2px</div>
<div><div class="box" style="border-radius:var(--radius-pill);width:100px"></div>pill · check dot only</div>
</div>
</body></html>
