<!-- @dsCard group="Type" viewport="700x180" name="Fluid Type Scale" subtitle="Every step, tokens named" -->
<!doctype html><html><head>
<meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-body);font-size:12px}.row{display:grid;grid-template-columns:5rem 1fr;gap:12px;align-items:baseline;padding-block:6px;border-top:1px solid var(--color-border)}.row:first-child{border-top:0}.tag{font-family:var(--font-mono);color:var(--color-text-muted)}.samp{font-family:var(--font-display);margin:0}</style>
</head><body>
<div class="row"><span class="tag">xs</span><p class="samp" style="font-size:var(--text-xs)">Aa</p></div>
<div class="row"><span class="tag">base</span><p class="samp" style="font-size:var(--text-base)">Aa</p></div>
<div class="row"><span class="tag">lg</span><p class="samp" style="font-size:var(--text-lg)">Aa</p></div>
<div class="row"><span class="tag">xl</span><p class="samp" style="font-size:var(--text-xl)">Aa</p></div>
<div class="row"><span class="tag">2xl</span><p class="samp" style="font-size:var(--text-2xl)">Aa</p></div>
<div class="row"><span class="tag">3xl</span><p class="samp" style="font-size:var(--text-3xl)">Aa</p></div>
</body></html>
