<!-- @dsCard group="Spacing" viewport="700x220" name="Graph-paper ruling" subtitle="8px module, always on — white hairlines inside .on-dark" -->
<!doctype html><html><head>
<meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-body);background:#fff;background-image:none}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cell{height:150px;border:1px solid var(--color-border-strong);box-shadow:var(--shadow-sm);padding:12px;display:flex;align-items:flex-end}.cap{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;background:var(--color-surface);border:1px solid var(--color-border);padding:3px 6px}</style>
</head><body>
<div class="pair">
<div class="cell grid-paper" style="background-color:#fff"><span class="cap">--grid-line on paper</span></div>
<div class="cell grid-paper on-dark" style="background-color:#111;color:#fff"><span class="cap" style="background:#1e1e1e;border-color:rgba(255,255,255,.2)">--grid-line on ink</span></div>
</div>
</body></html>
