<!-- @dsCard group="Colors" viewport="700x180" name="Semantic Roles" subtitle="What components actually consume" -->
<!doctype html><html><head>
<meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;font-family:var(--font-body);font-size:13px}table{width:100%;border-collapse:collapse}td{padding:6px 8px;border-bottom:1px solid var(--color-border)}.dot{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid var(--color-border-strong);vertical-align:-2px;margin-right:8px}code{color:var(--color-text-muted);font-family:var(--font-mono);font-size:11px}</style>
</head><body>
<table>
<tr><td><span class="dot" style="background:var(--color-bg)"></span>bg</td><td><code>--color-bg</code></td><td>Page ground</td></tr>
<tr><td><span class="dot" style="background:var(--color-surface)"></span>surface</td><td><code>--color-surface</code></td><td>Cards</td></tr>
<tr><td><span class="dot" style="background:var(--color-text)"></span>text</td><td><code>--color-text</code></td><td>Primary copy</td></tr>
<tr><td><span class="dot" style="background:var(--color-brand)"></span>brand</td><td><code>--color-brand</code></td><td>Links, cool accent</td></tr>
<tr><td><span class="dot" style="background:var(--cta-bg)"></span>cta</td><td><code>--cta-bg</code></td><td>Primary button (AA ≈5.6:1 w/ ink text)</td></tr>
<tr><td><span class="dot" style="background:var(--color-inverse-bg)"></span>inverse-bg</td><td><code>--color-inverse-bg</code></td><td>Dark bands / footer</td></tr>
</table>
</body></html>
