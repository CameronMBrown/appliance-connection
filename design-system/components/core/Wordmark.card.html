</head><body>
<div id="root"></div>
<script type="text/babel">

function Demo(){
  return (
    <React.Fragment>
      <div className="cell dark"><p className="cap">Arched · light · over video and ink</p><div className="arch"><Wordmark tone="light" /></div></div>
